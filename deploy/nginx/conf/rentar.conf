server {
    listen 80;
    server_name rentar.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    server_name rentar.local;

    ssl_certificate /etc/nginx/certs/rentar.crt;
    ssl_certificate_key /etc/nginx/certs/rentar.key;

    location / {
        proxy_pass http://app.internal.rentar.net:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}